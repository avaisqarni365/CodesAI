name: Deploy to GoDaddy cPanel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [closed]

  # Allow manual deployment
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # Only run on merged PRs or direct pushes to main
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true) || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Export static files (if using static export)
        run: |
          # If using static export, uncomment the next line
          # npm run export
          echo "Build completed successfully"

      - name: Prepare deployment files
        run: |
          # Create deployment directory
          mkdir -p deploy

          # Copy built files
          cp -r .next/standalone/* deploy/ 2>/dev/null || cp -r .next/* deploy/.next/
          cp -r public deploy/public 2>/dev/null || true
          cp -r .next/static deploy/.next/static 2>/dev/null || true

          # Copy configuration files if needed
          cp package.json deploy/ 2>/dev/null || true
          cp next.config.js deploy/ 2>/dev/null || true

          echo "Deployment files prepared"

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./deploy/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.next/cache/**

      - name: Deployment Success Notification
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "🚀 Website deployed to production"
          echo "🌐 Check your domain: https://codes-ai.com"

      - name: Deployment Failure Notification
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "Please check the logs above for details"
